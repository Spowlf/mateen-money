<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Only the app's own files run. connect-src allows https: because the backend address is typed into Settings; localhost is for npm run dev. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="Log spending in a few taps and see what's left this month.">
  <meta name="theme-color" content="#F3F6FC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F141D" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Money">
  <title>Mateen Money</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
  <!-- Every module app.js imports, fetched at once rather than level by level as imports are found (a test checks this). -->
  <link rel="modulepreload" href="src/db/api.js">
  <link rel="modulepreload" href="src/db/drafts.js">
  <link rel="modulepreload" href="src/db/idb.js">
  <link rel="modulepreload" href="src/db/repo.js">
  <link rel="modulepreload" href="src/db/schema.js">
  <link rel="modulepreload" href="src/engine/allowance.js">
  <link rel="modulepreload" href="src/engine/budgets.js">
  <link rel="modulepreload" href="src/engine/currency.js">
  <link rel="modulepreload" href="src/engine/dates.js">
  <link rel="modulepreload" href="src/engine/defaults.js">
  <link rel="modulepreload" href="src/engine/draft.js">
  <link rel="modulepreload" href="src/engine/export.js">
  <link rel="modulepreload" href="src/engine/forecast.js">
  <link rel="modulepreload" href="src/engine/form.js">

  <link rel="modulepreload" href="src/engine/recurring.js">
  <link rel="modulepreload" href="src/engine/review.js">
  <link rel="modulepreload" href="src/engine/settings.js">
  <link rel="modulepreload" href="src/engine/sort.js">
  <link rel="modulepreload" href="src/engine/splits.js">
  <link rel="modulepreload" href="src/engine/summary.js">
  <link rel="modulepreload" href="src/engine/terms.js">
  <link rel="modulepreload" href="src/engine/text.js">
  <link rel="modulepreload" href="src/engine/totals.js">
  <link rel="modulepreload" href="src/engine/vendors.js">

  <link rel="modulepreload" href="src/ui/format.js">
  <link rel="modulepreload" href="src/ui/headline.js">
  <link rel="modulepreload" href="src/ui/history.js">
  <link rel="modulepreload" href="src/ui/ibkr.js">
  <link rel="modulepreload" href="src/ui/log.js">

</head>
<body>
  <!-- Only this scrolls; the page itself never does, so iOS can't float the tab bar off the bottom. -->
  <div id="scroller" class="scroller">
  <header class="top">
    <div>
      <a id="back" class="back-link" href="#networth" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span>Net Worth</span>
      </a>
      <h1 id="title">Log</h1>
      <p id="synced" class="synced" hidden></p>
    </div>
    <button id="settings" type="button" class="icon-button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="view"></main>
  </div>

  <nav class="tabs" aria-label="Screens">
    <a href="#log" data-screen="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Log</span>
      <span class="badge" id="to-sort-badge" hidden></span>
    </a>
    <a href="#overview" data-screen="overview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Overview</span>
    </a>
    <a href="#networth" data-screen="networth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      <span>Net Worth</span>
    </a>
    <a href="#history" data-screen="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>History</span>
    </a>
    <a href="#plan" data-screen="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      <span>Plan</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <div role="status" aria-live="polite">
    <button id="update" type="button" class="update" hidden>Updated, tap to reload</button>
  </div>
</body>
</html>
