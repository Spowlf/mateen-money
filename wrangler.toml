# The Mateen Money API (Cloudflare Worker + D1). Setup steps: docs/deploy.md.
# The API token is a secret (npx wrangler secret put API_TOKEN), never in this file.

name = "mateen-money"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

# Run beside the database (D1, created in APAC), not near the phone: a request makes several
# queries in turn, so one long trip from the phone beats one per query. Smart placement can't do
# it, since it only picks places the Worker already runs, and every request comes from the UK.
[placement]
region = "aws:ap-southeast-1"

[vars]
ALLOWED_ORIGIN = "https://spowlf.github.io"

[[d1_databases]]
binding = "DB"
database_name = "mateen-money"
database_id = "fdb8f61b-71cb-469c-9c5d-82b9de42395c"

# Every 6 hours: add recurring items due today, then refresh rates.
# 00:15 UTC adds the day's items; 18:15 UTC picks up the ECB rates published that afternoon.
# Every 15 minutes: IBKR's nightly sync when due, prices for open markets, today's net worth.
# IBKR_FLEX_TOKEN and IBKR_FLEX_QUERY_ID are secrets too (docs/ibkr.md).
[triggers]
crons = ["15 */6 * * *", "*/15 * * * *"]
